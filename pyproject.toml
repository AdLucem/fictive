[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fictive"
version = "0.1.0"
description = "A library for creating LLM-based interactive fiction systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "anthropic",
    "lark",
    "llm-utils @ git+https://github.com/AdLucem/llm-utils.git",
    "nltk",
    "numpy",
    "openai",
    "scikit-learn",
    "scipy",
    "sentencepiece",
    "torch",
    "torchvision",
    "transformers",
]

[project.optional-dependencies]
backends = [
    "sglang",
    "vllm",
]
dev = [
    "pytest",
]
rag-bedrock = [
    "boto3",
]
bedrock = [
    "anthropic>=0.40",
    "boto3",
    "botocore[crt]",
]
web-search = [
    "boto3",
    "botocore[crt]",
]
rag-local = [
    "llama-index-core>=0.14.24,<0.15",
    "llama-index-embeddings-huggingface>=0.8.0,<0.9",
]
ui-server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fictive*"]
